    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#147AA2" stop-opacity=".22"/><stop offset="1" stop-color="#147AA2" stop-opacity="0"/></radialGradient>
    <linearGradient id="silverLeft" x1="0%" y1="90%" x2="100%" y2="0%">
