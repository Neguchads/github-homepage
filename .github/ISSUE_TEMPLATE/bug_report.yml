name: Bug report
description: Report a NAVI Homepage problem.
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Problem and reproduction
      description:
        Include revision, environment, and minimal steps. Never include secrets.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized evidence
