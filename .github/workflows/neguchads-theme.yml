name: Neguchads theme
on:
  pull_request:
    branches: [main]
    paths:
      - 'themes/**'
      - 'tests/brand/**'
      - 'docs/explore/**'
      - 'docs/universe/**'
      - 'scripts/build-universe.mjs'
      - 'scripts/build-portfolio.mjs'
      - '.github/workflows/neguchads-theme.yml'
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'tests/brand/**'
      - 'docs/explore/**'
      - 'docs/universe/**'
      - 'scripts/build-universe.mjs'
      - 'scripts/build-portfolio.mjs'
      - '.github/workflows/neguchads-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palette:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test theme registration and contrast
        run: |
          node scripts/build-portfolio.mjs --check
          node --test tests/brand/*.mjs
  rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test the existing card renderers
        run: npm run test -- --runInBand tests/renderStatsCard.test.js tests/renderRepoCard.test.js tests/renderTopLanguagesCard.test.js
